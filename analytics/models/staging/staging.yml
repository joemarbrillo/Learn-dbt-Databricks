models:
  - name: stg_job_postings
    description: >
      One row per posting per scrape day - a job re-scraped across
      days keeps every row.
    columns:
      - name: job_id
        description: The scrapers posting id
        data_tests:
          - not_null
      - name: search_term
        description:  The role the scraper searched for
        data_tests:
          - accepted_values:
              arguments:
                values: ['Data Engineer', 'Data Analyst', 'Data Scientist']
      - name: search_date
        description: Scrape day.
      - name: searched_at
        description: Scrape timestamp (search_time renamed)
      - name: search_location
        description: Location paremet the scraper searched under.
      - name: job_title
        description: Posting title as scraped/
      - name: company_name
        description: Employer name, trimmed.
      - name: job_location
        description: Posting location as scraped
      - name: source_platform
        description: Posting platform (job_via with the 'via ' replaced)
      - name: job_schedule_type
        description: As scraped; 12,252 nulls stay null - documented
        data_tests:
          - accepted_values:
              arguments:
                values: ['Part-time', 'Full-time', 'Contractor', 'Internship']
              config:
                severity: warn
      - name: job_work_from_home
        description: If flagged remote
      - name: job_posted_at
        description: 
      - name: job_salary
        description: 
      - name: salary_min
        description: Extracted minimum salary
        data_tests:
          - non_negative
      - name: salary_max
        description: Extracted maximum salary
        data_tests:
          - non_negative
      - name: salary_avg
        description: Average salary
      - name: salary_currency
        description: Salary currency
      - name: has_no_degree_mentioned
        description: One of the job extensions
      - name: has_health_insurance
        description: One of the job extensions
      - name: has_dental_insurance
        description: One of the job extensions
      - name: has_paid_time_off
        description: One of the job extensions
  
  - name: stg_job_skills
    description: >
      One row per (job_id, skill_id) pair, from the raw table.
    columns:
      - name: job_id
        description: Every pair's parent exists in stg_job_postings 
      - name: skill_id
        description: Skill key per pair
      - name: skill_keyword
        description: Skill text as extracted, trimmed

unit_tests:
  - name: test_parse_salary_shape
    description: This handles a range, a single value, and no salary at all
    model: stg_job_postings
    given:
      - input: source('jobs', 'raw_job_postings')
        rows:
          - {job_id: 1, job_salary: "100K–160K a year"}
          - {job_id: 2, job_salary: "32.5 an hour"}
          - {job_id: 3, job_salary: null}
    expect:
      rows:
        - {job_id: 1, salary_min: 100000, salary_max: 1860000}
        - {job_id: 2, salary_min: 32.5, salary_max: 32.5}
        - {job_id: 3, salary_min: null, salary_max: null}